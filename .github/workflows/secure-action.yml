name: Secure Action

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  secure-action:
    name: Secure Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # Users get the template rendered, so lint what lands in their repository.
      - name: Render the caller workflow template
        env:
          WORKFLOW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/userland/.github/workflows/next-upgrade.yml"
          mkdir -p "$(dirname "$rendered")"
          sed \
            -e "s/__NEXT_UPGRADE_WORKFLOW_SHA__/$WORKFLOW_SHA/" \
            -e 's/__NEXT_UPGRADE_NEXT_VERSION__/16.0.0/' \
            -e "s/__NEXT_UPGRADE_APP_PATH__/'.'/" \
            -e 's/__NEXT_UPGRADE_POLICY__/security/' \
            -e 's/__NEXT_UPGRADE_AGENT__/codex/' \
            -e 's/__NEXT_UPGRADE_AUTH__/api-key/' \
            -e "s/__NEXT_UPGRADE_MODEL__/''/" \
            -e "s/__NEXT_UPGRADE_EFFORT__/''/" \
            -e 's/__NEXT_UPGRADE_TELEMETRY_DISABLED__/false/' \
            templates/next-upgrade.yml > "$rendered"
          if grep -n '__NEXT_UPGRADE_' "$rendered"; then
            echo 'Render every template placeholder before linting.' >&2
            exit 1
          fi
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          "$RUNNER_TEMP/actionlint" -color "$RUNNER_TEMP/userland/.github/workflows/next-upgrade.yml"
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1
        with:
          inputs: . ${{ runner.temp }}/userland/.github/workflows/next-upgrade.yml
          version: 1.33.1
          advanced-security: false
          annotations: true
